# ORIENTAL24 — blueprint Render (production)
# Docs : docs.render.com/infrastructure-as-code
# 1) Pousser ce dépôt sur GitHub/GitLab  2) dashboard.render.com → New → Blueprint → choisir le dépôt
# 3) Compléter ORIENTAL24_TRUSTED_HOSTS (sync:false) avec le domaine réel, ex. oriental24.onrender.com
services:
  - type: web
    name: oriental24
    runtime: python
    plan: starter
    healthCheckPath: /healthz
    buildCommand: |
      mkdir -p /var/data/oriental24
      chmod 700 /var/data/oriental24
      pip install -r requirements.txt
    startCommand: >
      mkdir -p /var/data/oriental24 && chmod 700 /var/data/oriental24 &&
      gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 app:app
    disk:
      name: oriental24-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ORIENTAL24_MODE
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/oriental24/app.sqlite
      - key: ORIENTAL24_TRUSTED_HOSTS
        sync: false
      - key: ORIENTAL24_PROXY_HOPS
        value: "1"
      - key: ORIENTAL24_PUBLIC_REGISTRATION
        value: "0"
